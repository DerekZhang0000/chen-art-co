<!--
  Deliberately self-contained (inline styles, no external requests other
  than the logo and favicons) - Cloudflare Pages serves this automatically,
  with a real 404 status, for any request that doesn't match a real route.
-->
<style>
  :root {
    --text: #000000;
    --background: #ffffff;
    --primary: #ff0000;
    --secondary: #22062a;
    --accent: #a787ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 440px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
  }
  .brand img { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; }
  h1 {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 1.75rem;
    margin: 0 0 12px;
  }
  p { margin: 0 0 20px; line-height: 1.6; color: #333333; }
  .home-link {
    display: inline-block;
    margin-bottom: 28px;
    padding: 12px 28px;
    border-radius: 6px;
    background: var(--secondary);
    color: #ffffff;
    text-decoration: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .home-link:hover { background: #33083f; }
  .contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .contact a {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text);
    text-decoration: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .contact a:hover { color: var(--primary); }
  .contact svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="images/logo.png" alt="" />

    <a class="home-link" href="/">Back to Chen Art Co.</a>

        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">

              <stop offset="0%" stop-color="#feda75" />
              <stop offset="15%" stop-color="#fa7e1e" />
              <stop offset="45%" stop-color="#d62976" />
              <stop offset="70%" stop-color="#962fbf" />
